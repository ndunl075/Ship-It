# Public production deployments only. Pin a reviewed full SHA for immutable installs.
name: Celebrate a production deployment
on:
  deployment_status:
jobs:
  launch:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'production'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Launch on Ship It
        id: ship-it
        continue-on-error: true
        uses: ndunl075/Ship-It@10b9f01ae16a6f73f193fb84000e9b430e1d8231
        with:
          deployment_id: ${{ github.event.deployment.id }}
          api_url: https://ship-it-api.coform.workers.dev
